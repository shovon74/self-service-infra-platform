repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform format
        entry: terraform fmt -check -recursive terraform
        language: system
        files: \.tf$
        pass_filenames: false
      - id: tflint
        name: TFLint
        entry: tflint --recursive --chdir terraform
        language: system
        files: \.tf$
        pass_filenames: false
      - id: ansible-lint
        name: Ansible lint
        entry: ansible-lint
        language: system
        files: ^ansible/.*\.ya?ml$
      - id: yamllint
        name: YAML lint
        entry: yamllint
        language: system
        types: [yaml]
      - id: ruff
        name: Ruff
        entry: ruff check
        language: system
        types: [python]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.25.0
    hooks:
      - id: gitleaks